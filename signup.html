<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Registration | Forge & Form</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23F59E0B' d='M256 0c-35.3 0-64 28.7-64 64V128H128c-35.3 0-64 28.7-64 64V384c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V192c0-35.3-28.7-64-64-64H320V64c0-35.3-28.7-64-64-64zM224 64c0-17.7 14.3-32 32-32s32 14.3 32 32v64H224V64zM112 192c0-8.8 7.2-16 16-16H384c8.8 0 16 7.2 16 16v80H112V192zM112 320H400v64c0 8.8-7.2 16-16 16H128c-8.8 0-16-7.2-16-16V320z' /></svg>">
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/mobile-fix.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('assets/images/exhibition.png');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 2rem 5%;
        }

        .auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(5px);
        }

        [data-theme="dark"] .auth-overlay {
            background: rgba(2, 6, 23, 0.8);
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 3rem 2rem;
            background: var(--surface-color);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .auth-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
        }

        .auth-logo {
            font-family: var(--heading-font);
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: var(--transition);
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
        }

        .form-control {
            width: 100%;
            background: var(--background-color);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 1rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .form-control {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-auth {
            background: var(--accent-color);
            border: none;
            width: 100%;
            padding: 1.2rem;
            font-family: var(--heading-font);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-auth:hover {
            background: #92400E;
        }

        .social-login {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .social-login {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 2px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1.3rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        [data-theme="dark"] .social-btn {
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .social-btn:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            background: transparent;
        }

        [data-theme="dark"] .social-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .auth-card a {
            transition: all 0.3s ease;
        }

        .auth-card a:hover {
            opacity: 0.7;
            text-decoration: underline !important;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-overlay"></div>
        <div class="auth-card">
            <a href="index.html" class="auth-logo"><i class="fa-solid fa-fire-burner"
                    style="color: var(--accent-color);"></i>FORGE & FORM</a>
            <h2 style="margin-bottom: 1.5rem; font-family: var(--heading-font); color: var(--text-primary);">JOIN THE
                COLLECTIVE</h2>
            <form action="index.html">
                <input type="text" class="form-control" placeholder="FULL NAME" required>
                <input type="email" class="form-control" placeholder="EMAIL ADDRESS" required>
                <select class="form-control" style="background: var(--background-color); color: var(--text-primary);">
                    <option>I AM A COLLECTOR</option>
                    <option>I AM AN ARCHITECT</option>
                    <option>I AM A MUSEUM CURATOR</option>
                </select>
                <input type="password" class="form-control" placeholder="CREATE ACCESS KEY" required>
                <div
                    style="margin-bottom: 2rem; font-size: 0.8rem; display: flex; align-items: flex-start; gap: 10px; color: var(--text-secondary); text-align: start;">
                    <input type="checkbox" id="terms" required
                        style="accent-color: var(--accent-color); margin-top: 3px;">
                    <label for="terms">I AGREE TO THE <a href="#"
                            style="color: var(--accent-color); text-decoration: underline;">TERMS &
                            CONDITIONS</a></label>
                </div>
                <button type="submit" class="btn-auth">REQUEST ACCESS</button>

                <div class="social-login">
                    <p
                        style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px;">
                        Or Register With</p>
                    <div class="social-icons">
                        <a href="#" class="social-btn"><i class="fa-brands fa-google"></i></a>
                        <a href="#" class="social-btn"><i class="fa-brands fa-apple"></i></a>
                    </div>
                </div>

                <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-secondary);">ALREADY HAVE ACCESS? <a
                        href="login.html" style="color: var(--accent-color); font-weight: bold;">LOGIN</a></p>
                <p style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 2rem;">Registration allows
                    priority access to new project releases and private workshop journals.</p>
            </form>
        </div>
    </div>

    <script src="assets/js/theme-toggle.js"></script>
</body>

</html>
